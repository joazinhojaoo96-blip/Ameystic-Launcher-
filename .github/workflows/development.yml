name: Development build

on:
  pull_request:
    branches-ignore:
      - l10n_main
    types: [opened, reopened]
  push:
    branches-ignore:
      - l10n_main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Development build
    runs-on: macos-latest
    timeout-minutes: 90

    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Java JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install build dependencies
        shell: bash
        run: |
          brew install make cmake ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Verify build environment
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/javac" -version
          cmake --version
          ldid -h || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build for iOS
        shell: bash
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:/opt/homebrew/bin:$PATH"
          export SLIMMED=1

          BOOTJDK="$JAVA_HOME/bin"
          SDKPATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          JOBS="$(sysctl -n hw.ncpu)"

          gmake -j"$JOBS" dsym package \
            PLATFORM=2 \
            BOOTJDK="$BOOTJDK" \
            SDKPATH="$SDKPATH"

          gmake -j"$JOBS" dsym package \
            PLATFORM=2 \
            BOOTJDK="$BOOTJDK" \
            SDKPATH="$SDKPATH" \
            TROLLSTORE_JIT_ENT=1

      - name: Upload regular IPA
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-iOS-IPA
          path: artifacts/*.ipa
          if-no-files-found: error

      - name: Upload TrollStore TIPA
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-iOS-TrollStore
          path: artifacts/*.tipa
          if-no-files-found: warn

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-dSYM
          path: artifacts/AngelAuraAmethyst.dSYM
          if-no-files-found: warn
